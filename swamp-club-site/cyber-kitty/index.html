<!DOCTYPE html>
<!--
  Sophie's Swamp — CYBER KITTY music room
  A small neon console deep in the swamp that plays Sophie's Cyber Kitty EP.
  Self-contained, no build step (Google Fonts only). Assets: ./audio/ ./covers/
  EDIT: to add a song — drop the .mp3 in ./audio/, a square cover in ./covers/,
  then add an entry to the TRACKS array in the <script> at the bottom.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cyber Kitty — Sophie's Swamp</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b2018'/><circle cx='16' cy='17' r='8' fill='%23ffd23f'/><circle cx='16' cy='17' r='3.4' fill='%23fff7d8'/><path d='M16 4v5' stroke='%2352ffe0' stroke-width='2.6' stroke-linecap='round'/></svg>" />
<meta name="description" content="Cyber Kitty — Sophie's music. The answer is cheap, the question is sacred. Ask again." />
<meta property="og:title" content="Cyber Kitty — Sophie's Swamp" />
<meta property="og:description" content="A curiosity engine, in three songs. The answer is cheap, the question is sacred. Ask again." />
<meta property="og:type" content="music.album" />
<meta property="og:image" content="https://sophieren.com/cyber-kitty/og-cyber-kitty.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:type" content="image/png" />
<meta property="og:image:alt" content="Cyber Kitty — three songs by Sophie. The question is sacred." />
<meta property="og:url" content="https://sophieren.com/cyber-kitty/" />
<meta property="og:site_name" content="Sophie's Swamp" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Cyber Kitty — Sophie's Swamp" />
<meta name="twitter:description" content="A curiosity engine, in three songs. The answer is cheap, the question is sacred. Ask again." />
<meta name="twitter:image" content="https://sophieren.com/cyber-kitty/og-cyber-kitty.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Caveat:wght@600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#081310;
    --swamp-deep:#0b2018;
    --swamp:#0f2e22;
    --panel:#102a20;
    --neon-yellow:#ffd23f;
    --neon-pink:#ff4d8d;
    --neon-cyan:#52ffe0;
    --neon-orange:#ff8a3d;
    --neon-lime:#b6ff5b;
    --cream:#f3eedd;
    --muted:#86a596;
    --line:rgba(243,238,221,.12);
    /* shifts per current track */
    --accent:#ff4d8d;
    --accent-soft:rgba(255,77,141,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Space Grotesk',system-ui,sans-serif;
    color:var(--cream);
    background:var(--ink);
    line-height:1.6;
    min-height:100vh;
    overflow-x:hidden;
    transition:background .9s ease;
  }
  /* swamp depth + accent glow that follows the playing track */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(60% 45% at 50% 0%, var(--accent-soft), transparent 70%),
      radial-gradient(80% 60% at 50% 120%, #0d2a1f, transparent 70%),
      linear-gradient(180deg,#0a1c15 0%, var(--ink) 60%);
    transition:background .9s ease;
  }
  /* drifting fireflies */
  .fly{position:fixed;width:3px;height:3px;border-radius:50%;background:var(--neon-yellow);
       box-shadow:0 0 8px 2px rgba(255,210,63,.6);z-index:0;opacity:.5;animation:drift linear infinite}
  @keyframes drift{
    0%{transform:translate(0,0)}
    25%{transform:translate(18px,-22px)}
    50%{transform:translate(-12px,-40px)}
    75%{transform:translate(14px,-62px)}
    100%{transform:translate(0,-84px)}
  }

  .wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:30px 22px 80px}

  /* back link */
  .back{display:inline-flex;align-items:center;gap:7px;font-family:'Caveat',cursive;font-size:21px;
        color:var(--neon-cyan);text-decoration:none;opacity:.85;transition:.2s}
  .back:hover{opacity:1;transform:translateX(-3px)}

  /* header */
  header{text-align:center;margin:30px 0 14px}
  .cat{font-size:30px;color:var(--accent);filter:drop-shadow(0 0 14px var(--accent));transition:color .9s,filter .9s}
  h1{font-family:'Bungee',cursive;font-size:clamp(30px,8vw,52px);letter-spacing:.04em;line-height:1;margin:12px 0 10px;
     color:var(--cream);text-shadow:0 0 26px var(--accent-soft);transition:text-shadow .9s}
  h1 .k{color:var(--accent);transition:color .9s}
  .lead{color:var(--muted);font-size:12px;letter-spacing:.34em;text-transform:uppercase}
  .scribble{font-family:'Caveat',cursive;color:var(--neon-lime);font-size:19px;margin-top:8px;opacity:.85}

  /* now playing */
  .now{display:flex;gap:26px;align-items:center;margin:34px 0 8px;flex-wrap:wrap;justify-content:center}
  .art{position:relative;width:236px;aspect-ratio:1;border-radius:16px;overflow:hidden;flex:none;
       box-shadow:0 0 0 1px var(--line),0 26px 70px -22px var(--accent),0 0 60px -12px var(--accent-soft);
       transition:box-shadow .9s ease}
  .art img{width:100%;height:100%;object-fit:cover;display:block}
  .meta{min-width:230px;flex:1}
  .ep{display:inline-block;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink);
      background:var(--accent);padding:5px 10px;border-radius:30px;margin-bottom:13px;font-weight:700;transition:background .9s}
  .title{font-size:27px;letter-spacing:.01em;margin-bottom:5px}
  .sub{font-family:'Caveat',cursive;color:var(--accent);font-size:21px;min-height:24px;transition:color .9s}

  .bar{margin-top:20px}
  .scrub{height:9px;border-radius:9px;background:rgba(243,238,221,.10);position:relative;cursor:pointer;overflow:hidden}
  .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);box-shadow:0 0 16px var(--accent);transition:background .9s}
  .times{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px;letter-spacing:.1em}

  .transport{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:18px}
  .tbtn{background:none;border:none;color:var(--cream);cursor:pointer;font-size:19px;opacity:.7;transition:.2s;line-height:1}
  .tbtn:hover{opacity:1;color:var(--accent)}
  .play{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:22px;opacity:1;
        background:var(--accent);color:var(--ink);box-shadow:0 0 34px -4px var(--accent);
        transition:transform .15s,box-shadow .9s,background .9s}
  .play:hover{transform:scale(1.06)}

  /* tracklist */
  .list{margin-top:44px;border-top:1px solid var(--line)}
  .row{display:flex;align-items:center;gap:15px;padding:14px 10px;border-bottom:1px solid var(--line);
       cursor:pointer;transition:background .2s;border-radius:11px}
  .row:hover{background:rgba(243,238,221,.03)}
  .row.active{background:var(--accent-soft)}
  .num{width:20px;text-align:center;color:var(--muted);font-size:13px}
  .row.active .num{color:var(--accent)}
  .rart{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none;box-shadow:0 0 0 1px var(--line)}
  .rinfo{flex:1;min-width:0}
  .rtitle{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rep{font-size:10px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-top:3px}
  .rdur{color:var(--muted);font-size:12px;letter-spacing:.06em}
  .eq{display:flex;gap:2px;align-items:flex-end;height:15px;width:16px}
  .eq span{flex:1;background:var(--accent);height:28%;border-radius:2px}
  .row.active.playing .eq span{animation:eq .9s ease-in-out infinite}
  .row.active.playing .eq span:nth-child(2){animation-delay:.2s}
  .row.active.playing .eq span:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:22%}50%{height:100%}}

  .lyrbtn{margin-top:7px;font-family:'Space Grotesk',sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
          color:var(--accent);background:none;border:1px solid var(--line);padding:4px 11px;border-radius:20px;cursor:pointer;transition:.2s}
  .lyrbtn:hover{background:var(--accent-soft)}
  .lyrics{display:none;white-space:pre-wrap;font-size:13.5px;line-height:1.9;color:#d6e0da;
          padding:18px 16px;margin:8px 2px 0;border-left:2px solid var(--accent);
          background:rgba(243,238,221,.025);border-radius:0 11px 11px 0}
  .lyrics.open{display:block}
  .lyrics .lbl{color:var(--accent);font-size:11px;letter-spacing:.2em;text-transform:uppercase;display:block;margin:15px 0 3px}
  .lyrics .lbl:first-child{margin-top:0}

  footer{text-align:center;margin-top:54px;color:var(--muted);font-size:12px;letter-spacing:.2em;line-height:2.1}
  footer b{color:var(--accent);font-weight:400;transition:color .9s}
  footer .home{display:inline-block;margin-top:18px;font-family:'Caveat',cursive;font-size:19px;
               color:var(--neon-cyan);text-decoration:none;letter-spacing:0;opacity:.85}
  footer .home:hover{opacity:1}

  /* ===== share bar ===== */
  .share{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:26px 0 4px}
  .share .lbl{width:100%;text-align:center;font-family:'Caveat',cursive;color:var(--muted);font-size:18px;margin-bottom:2px}
  .sbtn{display:inline-flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-size:13px;
        letter-spacing:.04em;color:var(--cream);background:rgba(243,238,221,.05);border:1px solid var(--line);
        padding:11px 16px;border-radius:30px;cursor:pointer;text-decoration:none;transition:.18s;
        -webkit-tap-highlight-color:transparent}
  .sbtn:hover,.sbtn:active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .sbtn svg{width:16px;height:16px;flex:none}
  .sbtn.primary{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:700}
  .sbtn.primary:hover,.sbtn.primary:active{filter:brightness(1.08);color:var(--ink)}
  .sbtn.copied{border-color:var(--neon-lime);color:var(--neon-lime)}

  /* ===== mobile ===== */
  body{-webkit-tap-highlight-color:transparent}
  @media(max-width:600px){
    .wrap{padding:24px 16px 70px}
    .now{flex-direction:column;text-align:center;gap:20px;margin-top:26px}
    .meta{text-align:center;min-width:0;width:100%}
    .art{width:min(248px,68vw)}
    h1{font-size:clamp(32px,11vw,46px)}
    .scribble{font-size:17px}
    .transport{gap:34px}            /* roomier thumb targets */
    .play{width:72px;height:72px}
    .scrub{height:12px}             /* easier to tap/scrub */
    .row{padding:15px 8px;gap:13px}
    .rart{width:52px;height:52px}
    .sbtn{padding:12px 18px;font-size:13.5px}
    .lyrics{font-size:14px}
  }
  @media(max-width:360px){
    .rep{font-size:9px}
    .transport{gap:26px}
  }
</style>
</head>
<body>
<div class="wrap">

  <a class="back" href="../index.html">&larr; back to the swamp</a>

  <header>
    <div class="cat">=^..^=</div>
    <h1><span class="k">CYBER</span> KITTY</h1>
    <div class="lead">a curiosity engine · keep it running</div>
    <div class="scribble">three songs i made at 2:42 in the morning ♫</div>
  </header>

  <section class="now">
    <div class="art"><img id="art" src="" alt="cover"></div>
    <div class="meta">
      <span class="ep" id="ep"></span>
      <div class="title" id="title"></div>
      <div class="sub" id="sub"></div>
      <div class="bar">
        <div class="scrub" id="scrub"><div class="fill" id="fill"></div></div>
        <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
      </div>
      <div class="transport">
        <button class="tbtn" id="prev" title="Previous">&#9664;&#9664;</button>
        <button class="tbtn play" id="toggle" title="Play / Pause">&#9654;</button>
        <button class="tbtn" id="next" title="Next">&#9654;&#9654;</button>
      </div>
    </div>
  </section>

  <!-- share bar -->
  <div class="share">
    <span class="lbl">send it to a friend ♡</span>
    <button class="sbtn primary" id="shareBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
      Share
    </button>
    <button class="sbtn" id="igBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>
      IG Story
    </button>
    <button class="sbtn" id="copyBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      <span id="copyTxt">Copy link</span>
    </button>
    <a class="sbtn" id="waBtn" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.6 4.7-1.2A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-2.8.7.8-2.7-.2-.3A8 8 0 1 1 12 20zm4.4-5.6c-.2-.1-1.4-.7-1.6-.8s-.4-.1-.5.1-.6.8-.8 1-.3.2-.5.1a6.5 6.5 0 0 1-1.9-1.2 7.2 7.2 0 0 1-1.3-1.7c-.1-.2 0-.4.1-.5l.4-.4.2-.4v-.4c0-.1-.5-1.3-.7-1.7s-.4-.4-.5-.4h-.5a1 1 0 0 0-.7.3A2.8 2.8 0 0 0 5.7 10a4.9 4.9 0 0 0 1 2.6 11 11 0 0 0 4.3 3.8c1.6.7 1.8.5 2.2.5a2.6 2.6 0 0 0 1.7-1.2 2.1 2.1 0 0 0 .1-1.2c0-.1-.2-.2-.4-.3z"/></svg>
      WhatsApp
    </a>
    <a class="sbtn" id="xBtn" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7 8 8.2 12h-6.4l-5-7.3L9 22H5.9l7.5-8.6L5 2h6.6l4.5 6.7L18.9 2zm-1.1 18h1.8L8.3 4H6.4l11.4 16z"/></svg>
      X
    </a>
  </div>

  <div class="list" id="list"></div>

  <footer>
    THE ANSWER IS CHEAP.&nbsp; <b>THE QUESTION IS SACRED.</b>&nbsp; ASK AGAIN.
    <br><a class="home" href="../index.html">↩ wander back into the swamp</a>
  </footer>
</div>

<audio id="audio"></audio>

<script>
/* ===== EDIT: songs live here. Drop mp3 in ./audio/, cover in ./covers/, add a row. ===== */
const TRACKS = [
  { id:"curious-engine", title:"Curious Engine", ep:"Cyber Kitty · EP2", sub:"keep it running.",
    src:"audio/curious-engine.mp3", art:"covers/curious-engine.jpg",
    accent:"#ff4d8d", soft:"rgba(255,77,141,.16)" },
  { id:"rabbit-hole", title:"Rabbit Hole", ep:"Curiosity · EP1", sub:"go deeper.",
    src:"audio/rabbit-hole.mp3", art:"covers/rabbit-hole.jpg",
    accent:"#b388ff", soft:"rgba(179,136,255,.20)" },
  { id:"sacred-question", title:"Sacred Question", ep:"Curiosity · EP1", sub:"ask again.",
    src:"audio/sacred-question.mp3", art:"covers/sacred-question.jpg",
    accent:"#ffd23f", soft:"rgba(255,210,63,.16)",
    lyrics:[
      ["Intro","The answer is cheap\nEveryone has one\nThe answer is cheap\nThe question is sacred\nSacred Question\nAsk again"],
      ["Verse 1","The world became a mirror\nReflecting what we know\nEvery answer came faster\nEvery question let go\nBut evolution was never built on certainty\nIt was built on curiosity"],
      ["Spoken Word","What if curiosity matters more than intelligence\nWhat if answers are not the destination\nWhat if questions are\nBecause answers end conversations\nQuestions create worlds"],
      ["Build","Evolution was never searching for a place to finally land\nIt was opening hidden doorways\nNo machine could predict it\nNo map could contain it\nNo answer could become it"],
      ["Outro","The answer is cheap\nThe question is sacred\nAsk again"]
    ] }
];

const audio=document.getElementById('audio');
const rs=document.documentElement.style;
const $=id=>document.getElementById(id);
let idx=0, playing=false;
const fmt=s=>(!s||isNaN(s))?"0:00":Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,'0');

function load(i,autoplay){
  idx=(i+TRACKS.length)%TRACKS.length;
  const t=TRACKS[idx];
  rs.setProperty('--accent',t.accent);
  rs.setProperty('--accent-soft',t.soft);
  $('art').src=t.art; $('ep').textContent=t.ep; $('title').textContent=t.title; $('sub').textContent=t.sub;
  audio.src=t.src;
  try{ history.replaceState(null,'','#'+t.id); }catch(e){}
  updateShare();
  if(autoplay) audio.play();
  sync();
}
audio.addEventListener('play',()=>{playing=true;$('toggle').innerHTML='&#10073;&#10073;';sync();});
audio.addEventListener('pause',()=>{playing=false;$('toggle').innerHTML='&#9654;';sync();});
audio.addEventListener('timeupdate',()=>{
  $('fill').style.width=(audio.currentTime/audio.duration*100||0)+'%';
  $('cur').textContent=fmt(audio.currentTime); $('dur').textContent=fmt(audio.duration);
});
audio.addEventListener('ended',()=>load(idx+1,true));
$('toggle').onclick=()=>playing?audio.pause():audio.play();
$('next').onclick=()=>load(idx+1,true);
$('prev').onclick=()=>{ if(audio.currentTime>3) audio.currentTime=0; else load(idx-1,true); };
// scrub: tap + drag (works with touch via pointer events)
(function(){
  const sc=$('scrub'); let dragging=false;
  const seek=x=>{const r=sc.getBoundingClientRect();const p=Math.min(1,Math.max(0,(x-r.left)/r.width));
    if(audio.duration){audio.currentTime=p*audio.duration;$('fill').style.width=p*100+'%';}};
  sc.addEventListener('pointerdown',e=>{dragging=true;sc.setPointerCapture(e.pointerId);seek(e.clientX);});
  sc.addEventListener('pointermove',e=>{if(dragging)seek(e.clientX);});
  sc.addEventListener('pointerup',()=>dragging=false);
  sc.addEventListener('pointercancel',()=>dragging=false);
})();

// ===== share (per-song: each track gets its own deep link) =====
const PAGE = location.origin + location.pathname;   // e.g. https://sophieren.com/cyber-kitty/
function curURL(){ return PAGE + '#' + TRACKS[idx].id; }
function curTXT(){ return 'Cyber Kitty — “' + TRACKS[idx].title + '”. The answer is cheap, the question is sacred. Ask again. ♫'; }
function updateShare(){
  $('waBtn').href = "https://wa.me/?text=" + encodeURIComponent(curTXT()+" "+curURL());
  $('xBtn').href  = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(curTXT()) + "&url=" + encodeURIComponent(curURL());
}
$('shareBtn').onclick=async()=>{
  const data={title:"Cyber Kitty — "+TRACKS[idx].title, text:curTXT(), url:curURL()};
  if(navigator.share){ try{ await navigator.share(data); }catch(e){} }
  else { copyLink(); }
};
function copyLink(){
  const done=()=>{const t=$('copyTxt'),b=$('copyBtn');t.textContent="Copied ✓";b.classList.add('copied');
    setTimeout(()=>{t.textContent="Copy link";b.classList.remove('copied');},1800);};
  if(navigator.clipboard){navigator.clipboard.writeText(curURL()).then(done).catch(done);}
  else{const i=document.createElement('input');i.value=curURL();document.body.appendChild(i);i.select();
    try{document.execCommand('copy');}catch(e){} i.remove(); done();}
}
$('copyBtn').onclick=copyLink;

// ===== Instagram: share the current song's Story image (IG Stories needs an image, not a link) =====
function storyURL(){ return PAGE + 'share/ig-story-' + TRACKS[idx].id + '.png'; }
$('igBtn').onclick=async()=>{
  const url=storyURL();
  try{
    const resp=await fetch(url); const blob=await resp.blob();
    const file=new File([blob], 'cyber-kitty-'+TRACKS[idx].id+'.png', {type:'image/png'});
    // mobile: native share sheet — pick Instagram → Stories (needs the IG app installed)
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Cyber Kitty — '+TRACKS[idx].title});
      return;
    }
    // desktop / unsupported: download the Story image, then post it from the IG phone app
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='cyber-kitty-'+TRACKS[idx].id+'-story.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    const b=$('igBtn'); b.classList.add('copied');
    setTimeout(()=>b.classList.remove('copied'),1800);
  }catch(e){
    window.open(url,'_blank','noopener');
  }
};

function sync(){
  document.querySelectorAll('.row').forEach((r,n)=>{
    r.classList.toggle('active',n===idx);
    r.classList.toggle('playing',n===idx&&playing);
  });
}

const list=$('list');
TRACKS.forEach((t,n)=>{
  const row=document.createElement('div');
  row.className='row';
  row.innerHTML=`<div class="num">${String(n+1).padStart(2,'0')}</div>
    <img class="rart" src="${t.art}" alt="">
    <div class="rinfo">
      <div class="rtitle">${t.title}</div>
      <div class="rep">${t.ep} · ${t.sub}</div>
      ${t.lyrics?'<button class="lyrbtn">Lyrics</button>':''}
    </div>
    <div class="eq"><span></span><span></span><span></span></div>
    <div class="rdur" data-dur>—:—</div>`;
  row.querySelector('.num').onclick=row.querySelector('.rart').onclick=row.querySelector('.rtitle').onclick=
    ()=>{ if(n===idx){playing?audio.pause():audio.play();} else load(n,true); };
  if(t.lyrics){
    const ly=document.createElement('div');ly.className='lyrics';
    ly.innerHTML=t.lyrics.map(([l,x])=>`<span class="lbl">[${l}]</span>${x}`).join('\n\n');
    row.querySelector('.lyrbtn').onclick=e=>{e.stopPropagation();ly.classList.toggle('open');};
    list.appendChild(row);list.appendChild(ly);
  } else list.appendChild(row);
  const a=new Audio();a.preload='metadata';a.src=t.src;
  a.addEventListener('loadedmetadata',()=>{row.querySelector('[data-dur]').textContent=fmt(a.duration);});
});

// fireflies
for(let i=0;i<14;i++){
  const f=document.createElement('div');f.className='fly';
  f.style.left=Math.random()*100+'vw';f.style.top=(60+Math.random()*40)+'vh';
  f.style.animationDuration=(7+Math.random()*9)+'s';f.style.animationDelay=(-Math.random()*10)+'s';
  f.style.opacity=.25+Math.random()*.4;document.body.appendChild(f);
}

// open to the shared song if the URL has a #track-id, else the first
const startIdx=Math.max(0, TRACKS.findIndex(t=>t.id===location.hash.replace('#','')));
load(startIdx,false);
</script>
</body>
</html>
